name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web-pdf-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-pdf-reader/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
